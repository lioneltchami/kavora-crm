name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          # Provide dummy values so build doesn't crash on missing env.
          # The Clerk publishable key must be a valid pk_test_<base64> shape so
          # the static-prerender phase of `next build` accepts it. This decodes
          # to "clerk.example.com$" — not a real Clerk instance, but valid format.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgresql://localhost:5432/dummy

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kavora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install pgTAP
        run: sudo apt-get update && sudo apt-get install -y postgresql-16-pgtap
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/kavora_test
        run: node scripts/apply-pending-migrations.mjs
      - name: Run RLS tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/kavora_test
        run: bash scripts/test-rls.sh
